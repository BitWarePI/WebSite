<script>
  const inputInicio = document.getElementById('dt_inicio');
  const inputFim = document.getElementById('dt_fim');
  const btnAplicar = document.getElementById('btn_aplicar');
  const parametro = document.getElementById('parametro');

  const kpiusogpu = document.getElementById('kpiusogpu');
  const kpitempgpu = document.getElementById('kpitempgpu');
  const kpiusocpu = document.getElementById('kpiusocpu');
  const kpitempcpu = document.getElementById('kpitempcpu');

  const kpiGpuUsoValor = kpiusogpu.querySelector('.kpi-gpu-uso');
  const kpiGpuTempValor = kpitempgpu.querySelector('.kpi-gpu-temp');
  const kpiCpuUsoValor = kpiusocpu.querySelector('.kpi-cpu-uso');
  const kpiCpuTempValor = kpitempcpu.querySelector('.kpi-cpu-temp');

  const kpiMedianaUsoCpu = document.getElementsByClassName('kpi-cpu-uso-mediana')[0];
  const kpiMedianaTempCpu = document.getElementsByClassName('kpi-cpu-temp-mediana')[0];
  const kpiMedianaUsoGpu = document.getElementsByClassName('kpi-gpu-uso-mediana')[0];
  const kpiMedianaTempGpu = document.getElementsByClassName('kpi-gpu-temp-mediana')[0];

  const info = document.getElementsByClassName("info");

  async function quantidadeMaquinas() {
    const empresaId = sessionStorage.getItem('idEmpresa');
    const response = await fetch(`/maquina/qtdMaquina/${empresaId}`);
    if (!response.ok) throw new Error('Erro na requisição personalizada');
    const dados = await response.json();
    console.log(dados)

    qtdMaquinas.innerHTML = dados[0].total
  }

  // calcula mediana
  function mediana(dados, tipo) {
    const valores = dados.map(d => parseFloat(d[tipo])).sort((a, b) => a - b);
    const n = valores.length;
    if (n % 2 === 0) return ((valores[n / 2 - 1] + valores[n / 2]) / 2).toFixed(1);
    return valores[Math.floor(n / 2)].toFixed(1);
  }

  function definirCorPadrao(valor, tipo) {
    if (tipo.includes('uso')) {
      if (valor < 50) return '#ff4b4b'; // vermelho
      if (valor < 70) return '#e4b131'; // amarelo
      return '#4caf50'; // verde
    } else {
      if (valor > 80) return '#ff4b4b'; // vermelho
      if (valor > 70) return '#e4b131'; // amarelo
      return '#4caf50'; // verde
    }
  }

  async function definirCorPersonalizada(valor, tipo) {
    const empresaId = sessionStorage.getItem('idEmpresa');
    const response = await fetch(`/maquina/empresa/parametros-gerais/${empresaId}`);
    if (!response.ok) throw new Error('Erro na requisição personalizada');
    const dados = await response.json();

    const limites = {
      usocpu: dados.cpu_percent,
      usogpu: dados.gpu_percent,
      tempcpu: dados.cpu_temperature,
      tempgpu: dados.gpu_temperature
    };

    if (tipo.includes('uso')) {
      if (valor < limites[tipo]) return '#ff4b4b';
      if (valor < limites[tipo] + 5) return '#e4b131';
      return '#4caf50';
    } else {
      if (valor > limites[tipo]) return '#ff4b4b';
      if (valor > limites[tipo] - 5) return '#e4b131';
      return '#4caf50';
    }
  }

  async function aplicarCores() {
    const modo = parametro.value;
    const gpuUso = parseFloat(kpiGpuUsoValor.textContent);
    const gpuTemp = parseFloat(kpiGpuTempValor.textContent);
    const cpuUso = parseFloat(kpiCpuUsoValor.textContent);
    const cpuTemp = parseFloat(kpiCpuTempValor.textContent);

    if (modo === "2") {
      // personalizado
      kpiusogpu.style.backgroundColor = await definirCorPersonalizada(gpuUso, 'usogpu');
      kpitempgpu.style.backgroundColor = await definirCorPersonalizada(gpuTemp, 'tempgpu');
      kpiusocpu.style.backgroundColor = await definirCorPersonalizada(cpuUso, 'usocpu');
      kpitempcpu.style.backgroundColor = await definirCorPersonalizada(cpuTemp, 'tempcpu');
      document.getElementById("tituloParam").innerHTML = "";

      for (let i = 0; i < info.length; i++) {
        info[i].style.display = 'none';
      }
      console.log(info[0])
    } else {
      // padrão
      for (let i = 0; i < info.length; i++) {
        info[i].style.display = 'flex';
      }
      console.log(info[0])

      kpiusogpu.style.backgroundColor = definirCorPadrao(gpuUso, 'uso');
      kpitempgpu.style.backgroundColor = definirCorPadrao(gpuTemp, 'temp');
      kpiusocpu.style.backgroundColor = definirCorPadrao(cpuUso, 'uso');
      kpitempcpu.style.backgroundColor = definirCorPadrao(cpuTemp, 'temp');
    }

  }

  parametro.addEventListener('change', aplicarCores);
  parametro.addEventListener('change', tirarParametrosPadrao())

  function tirarParametrosPadrao() {
    console.log("PARAMETRO: " + parametro.value)
    console.log("entrou aq")
    if (parametro.value == 2) {
      document.getElementById("tituloParam").innerHTML = "";
    }

  }

  function graficos(dados) {
    var valores = {}
    for (var i = 0; i < dados.length; i++) {
      const data = valores[dados[i].data]
      if (data) {
        data.push(dados[i])
      } else {
        valores[dados[i].data] = [dados[i]]
      }
    }

    var resultado2 = {}
    grafico1.data.labels = []
    grafico1.data.datasets[0].data = []
    grafico2.data.labels = []
    grafico2.data.datasets[0].data = []
    grafico3.data.labels = []
    grafico3.data.datasets[0].data = []
    grafico4.data.labels = []
    grafico4.data.datasets[0].data = []

    for (const [key, valor] of Object.entries(valores)) {
      console.log(valor)
      resultados = valor.reduce((total, atual, index) => {
        total.gpu_percent += atual.gpu_percent
        total.cpu_percent += atual.cpu_percent
        total.gpu_temperature += atual.gpu_temperature
        total.cpu_temperature += atual.cpu_temperature
        if (index == valor.length - 1) {
          total.gpu_percent /= valor.length
          total.cpu_percent /= valor.length
          total.gpu_temperature /= valor.length
          total.cpu_temperature /= valor.length
        }
        return total
      })

      grafico1.data.datasets[0].data.push(resultados.gpu_percent)
      grafico1.data.labels.push(key)

      grafico2.data.datasets[0].data.push(resultados.gpu_temperature)
      grafico2.data.labels.push(key)

      grafico3.data.datasets[0].data.push(resultados.cpu_percent)
      grafico3.data.labels.push(key)

      grafico4.data.datasets[0].data.push(resultados.cpu_temperature)
      grafico4.data.labels.push(key)

    }
    grafico1.update()
    grafico2.update()
    grafico3.update()
    grafico4.update()

  }

  async function aplicarPeriodo() {
    const inicio = inputInicio.value;
    const fim = inputFim.value;

    if (!inicio || !fim) return alert('Selecione as duas datas!');
    if (inicio > fim) return alert('Datas incoerentes!');

    try {
      const response = await fetch(`http://localhost:3333/kpis?inicio=${inicio}&fim=${fim}`);
      if (!response.ok) throw new Error('Erro na requisição: ' + response.status);

      const dados = await response.json();
      if (!Array.isArray(dados) || dados.length === 0) {
        alert('Nenhum dado encontrado para o período selecionado.');
        return;
      }

      const media = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
      const mediaGpuUso = media(dados.map(d => parseFloat(d.gpu_percent))).toFixed(1);
      const mediaGpuTemp = media(dados.map(d => parseFloat(d.gpu_temperature))).toFixed(1);
      const mediaCpuUso = media(dados.map(d => parseFloat(d.cpu_percent))).toFixed(1);
      const mediaCpuTemp = media(dados.map(d => parseFloat(d.cpu_temperature))).toFixed(1);

      kpiGpuUsoValor.textContent = `${mediaGpuUso}%`;
      kpiGpuTempValor.textContent = `${mediaGpuTemp}°C`;
      kpiCpuUsoValor.textContent = `${mediaCpuUso}%`;
      kpiCpuTempValor.textContent = `${mediaCpuTemp}°C`;

      kpiMedianaTempCpu.textContent = `${mediana(dados, "cpu_temperature")}°C`;
      kpiMedianaTempGpu.textContent = `${mediana(dados, "gpu_temperature")}°C`;
      kpiMedianaUsoCpu.textContent = `${mediana(dados, "cpu_percent")}%`;
      kpiMedianaUsoGpu.textContent = `${mediana(dados, "gpu_percent")}%`;

      graficos(dados)

      aplicarCores();

    } catch (error) {
      console.error("Erro ao buscar dados:", error);
      alert("Ocorreu um erro ao buscar os dados.");
    }
  }

  btnAplicar.addEventListener('click', aplicarPeriodo);

  window.addEventListener('DOMContentLoaded', () => {
    aplicarCores()
    quantidadeMaquinas()
  });
</script>
