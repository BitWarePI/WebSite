<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Bitware</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/default.css">
    <link rel="stylesheet" href="./css/animacao.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" href="./assets/icon/favicon2.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=close,visibility,visibility_off" />
</head>

<body>
    
    <section class="sessao-login">
        <div class="container">
            <a href="index.html"><img src="./assets/imgs/Logo.svg" alt="" class="logo slide-in-top"></a>
            <div class="formulario slide-in-bottom">
                <div class="header">
                    <h1>Login</h1>
                    <p>Monitore sua mineração conosco!</p>
                </div>
                <div class="ipt_label">
                    <label for="email_input">E-mail</label>
                    <input id="email_input" type="text" placeholder="">
                </div>
                <div class="ipt_label">
                    <label for="senha_input">Senha</label>
                    <input id="senha_input" type="password" placeholder="">
                    <span class="show-icon material-symbols-outlined" id="senha_input_icon" onclick="mostrarSenha('senha_input', 'senha_input_icon')">visibility_off</span>
                </div>
                <button class="btn submit" onclick="entrar()">Entrar</button>
                <a href="cadastro.html" class="btn-cadastrar">Cadastrar-se</a>
            </div>

            <div class="bg-light"></div>
            <div class="bg-light2"></div>
        </div>
    </section>

    <div class="modal">
        <div class="modal-container" id="modal_container_solicitacoes">
            <div class="header">
                <h1 id="card-title"></h1>
                <button class="material-symbols-outlined close-icon" onclick="abrirModal()">
                    close
                </button>
            </div>
            <div class="body" id="cardErro">
                <p id="card-text"></p>
            </div>
        </div>
    </div>
</body>

</html>

<script>
    function mostrarSenha(inputId, iconId){
        input = document.getElementById(inputId);
        icon = document.getElementById(iconId);
        if(icon.innerText == "visibility_off"){
            input.type = "text";
            icon.innerText = "visibility";
        } else{
            input.type = "password";
            icon.innerText = "visibility_off";
        }
    }

    function abrirModal(titulo, texto, tipo) {
        const modal = document.querySelector('.modal');
        const modalContainer = document.querySelector('.modal-container');
        if(!modal.classList.contains('open')){
            if(tipo == 'sucesso'){
                document.getElementById('modal_container_solicitacoes').style.borderLeft = "10px solid #4BB543";
            } else if(tipo == 'erro'){
                document.getElementById('modal_container_solicitacoes').style.borderLeft = "10px solid #FF0000";
            } else{
                document.getElementById('modal_container_solicitacoes').style.borderLeft = "none";
            }
            document.getElementById('card-title').innerText = titulo;
            document.getElementById('card-text').innerText = texto;
            modal.classList.remove("fade-out-flex");
            modal.classList.add('open');
            modal.classList.add("fade-in");
            modalContainer.classList.add("slide-in-top");
        } else{
            modal.classList.remove("fade-in");
            modalContainer.classList.remove("slide-in-top");
            modal.classList.remove('open');
            modal.classList.add("fade-out-flex");
        }
    }

    function entrar() {
        // aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            abrirModal("Erro!", "Preencha todos os campos para prosseguir!", "erro");
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.ID_USUARIO = json.idFuncionario;
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.FK_CARGO = json.fkCargo;
                    sessionStorage.idEmpresa = json.fkEmpresa;

                    abrirModal("Sucesso!", "Login efetuado com Sucesso!", "sucesso");

                    if (sessionStorage.FK_CARGO == 1) {
                        setTimeout(function () {
                            window.location = "../dashAdm/dashEmpresa.html";
                        }, 1000);
                    } else if (sessionStorage.FK_CARGO == 3) {
                        setTimeout(function () {
                            window.location = "../dashAnalista/dashHome.html";
                        }, 1000);
                    } else if (sessionStorage.FK_CARGO == 4) {
                        setTimeout(function () {
                            window.location = "../dashTecnico/dashHome2.html";
                        }, 1000);
                    } else {
                        setTimeout(function () {
                            window.location = "../dashEmpresa/dashHome.html";
                        }, 1000); // apenas para exibir o loading
                    }

                });

            } else {

                resposta.text().then(texto => {
                    console.error(texto);
                    abrirModal("Erro no Login!", "Email/senha inválidos! ou Empresa não encontrada!", "erro");
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
