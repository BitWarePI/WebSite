    <script src="../js/nav.js"></script>
    <script>
        function carregarEmpresas() {
            fetch("/empresas/listarEmpresasDelecao", {
                method: "GET"
            })
                .then(function (resposta) {
                    resposta.json().then(function (empresas) {
                        if (resposta.ok) {
                            console.log("Empresas recebidas:", empresas);
                            criarEmpresas(empresas);
                        } else {
                            console.error("Erro ao buscar empresas:", resposta.statusText);
                        }
                    });
                })
                .catch(function (erro) {
                    console.error("#ERRO:", erro);
                });
        }

        function criarEmpresas(empresas) {
            const corpoTabela = document.querySelector("table tbody");
            corpoTabela.innerHTML = ""; // Limpa a tabela antes de adicionar novos dados.

            for (let i = 0; i < empresas.length; i++) {
                const empresa = empresas[i];

                // Verificar diretamente se o valor de 'ativo' é 0 ou 1
                if (Number(empresa.ativo?.data?.[0]) === 1) {
                    estado = "Ativo";
                } else {
                    estado = "Inativo";
                }

                // Gerar a tag <span> com a classe correspondente ao estado (Ativo ou Inativo)
                const estadoSpan = `<span class="${estado.toLowerCase()}">${estado}</span>`;

                // Botão de ativar ou inativar dependendo do estado
                // Botão de ativar ou inativar dependendo do estado
                const botaoAtivarOuInativar = `<button class="material-symbols-outlined ativo btn-toggle" title="Aprovar solicitação" data-id="${empresa.idEmpresa}"
         data-ativo="0" onclick="aprovarSolicitacao(${empresa.idEmpresa})">check</button>`;
                // Adiciona os dados na tabela
                corpoTabela.innerHTML += `
            <tr>
                <td class="nome"><p>${empresa.nome}</p></td>
                <td class="email">${empresa.email || ""}</td>
                <td class="cnpj">${empresa.cnpj || ""}</td>
                <td class="dt_cadastro">${formatarData(empresa.dtCadastro)}</td>
                <td class="acao">
                    <button class="material-symbols-outlined ver-mais" title="Negar solicitação" onclick="negarSolicitacao(${empresa.idEmpresa})">remove</button>
                    ${botaoAtivarOuInativar}
                </td>
            </tr>
        `;
            }
        }

        function aprovarSolicitacao(idEmpresa) {
            fetch(`/empresas/aprovarSolicitacao`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    idEmpresa: idEmpresa
                })
            }).then(resposta => {
                if (resposta.ok) {
                    window.location = "./dashExclusoes.html";

                } else {
                    alert("Erro ao aprovar solicitação")
                }
            }).catch(function (erro) {
                console.log("Erro ao aprovar solicitação:", erro);
            });
        }

        function negarSolicitacao(idEmpresa) {
            fetch(`/empresas/negarSolicitacao`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    idEmpresa: idEmpresa
                })
            }).then(resposta => {
                if (resposta.ok) {
                    window.location = "./dashExclusoes.html";

                } else {
                    alert("Erro ao negar solicitação")
                }
            }).catch(function (erro) {
                console.log("Erro ao negar solicitação:", erro);
            });
        }

        function formatarData(dataISO) {
            const data = new Date(dataISO);
            const dia = String(data.getDate()).padStart(2, '0');
            const mes = String(data.getMonth() + 1).padStart(2, '0');
            const ano = data.getFullYear();
            return `${dia}/${mes}/${ano}`;
        }

        window.onload = function () {
            carregarEmpresas();

            setInterval(function () {
                carregarEmpresas();
            }, 5000); // Atualiza as empresas a cada 5 segundos
        }
    </script>
